<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Quiz Battle</title>
  <style>
    body{font-family:Arial,sans-serif;background:#111827;color:white;text-align:center;padding:25px 12px}
    .container{max-width:460px;margin:25px auto;background:#1f2937;padding:22px;border-radius:16px}
    input,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border:0;border-radius:8px;font-size:16px}
    button{background:#6366f1;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
    #status{color:#fbbf24;overflow-wrap:anywhere}#room{font-size:24px;letter-spacing:3px}.hidden{display:none}.option{background:#374151}
  </style>
</head>
<body>
  <div class="container">
    <h1>⚡ Quick Quiz Battle</h1>
    <p>Multiplayer quiz for 2–8 players</p>
    <input id="playerName" maxlength="20" placeholder="Enter your name">
    <button id="createButton">Create Room</button>
    <hr>
    <input id="roomInput" maxlength="6" placeholder="Enter room code">
    <button id="joinButton">Join Room</button>
    <p id="status">Connecting to Firebase…</p>
    <section id="lobby" class="hidden">
      <h2>Room Code</h2><p id="room"></p><h3>Players</h3><div id="players"></div>
      <button id="startButton" class="hidden">Start Quiz</button>
    </section>
    <section id="quiz" class="hidden">
      <p id="roundInfo"></p><h2 id="question"></h2><p>Time left: <strong id="timer">20</strong> seconds</p>
      <div id="options"></div><p id="scoreboard"></p>
    </section>
    <section id="results" class="hidden"><h2>🏆 Results</h2><div id="finalScores"></div><button id="homeButton">Back to Home</button></section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
    import { getDatabase, ref, get, set, update, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDTRVKfwTLtpCoAwWwHdbvmgbidT4pAR4c",
      authDomain: "quick-quiz-battle.firebaseapp.com",
      databaseURL: "https://quick-quiz-battle-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quick-quiz-battle",
      storageBucket: "quick-quiz-battle.firebasestorage.app",
      messagingSenderId: "746787329980",
      appId: "1:746787329980:web:599abb627bd5f72cc23db9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const $ = id => document.getElementById(id);
    const questions = [
      {q:"What is the capital of India?",a:["Mumbai","New Delhi","Kolkata","Chennai"],c:1},
      {q:"How many days are in a week?",a:["5","6","7","8"],c:2},
      {q:"Which planet is known as the Red Planet?",a:["Venus","Mars","Jupiter","Mercury"],c:1},
      {q:"What is 5 + 7?",a:["10","11","12","13"],c:2},
      {q:"Which animal is often called the King of the Jungle?",a:["Tiger","Elephant","Lion","Bear"],c:2},
      {q:"How many months are in a year?",a:["10","11","12","13"],c:2},
      {q:"Which is the largest ocean?",a:["Atlantic","Indian","Arctic","Pacific"],c:3},
      {q:"Which gas do humans need to breathe?",a:["Oxygen","Helium","Carbon dioxide","Hydrogen"],c:0},
      {q:"How many sides does a triangle have?",a:["2","3","4","5"],c:1}
    ];
    let uid=null, roomCode=null, isHost=false, busy=false, roomData=null, unsubscribe=null, timerHandle=null, advancing=false;
    const roomRef = code => ref(db,"rooms/"+code);
    function status(message){$("status").textContent=message;}
    function makeCode(){return Math.random().toString(36).slice(2,8).toUpperCase();}
    function show(section){["lobby","quiz","results"].forEach(id=>$(id).classList.toggle("hidden",id!==section));}

    async function connect(){
      try{
        const result=await signInAnonymously(auth);
        uid=result.user.uid;
        status("Connected to Firebase. Enter your name to begin.");
      }catch(error){status("Connection error: "+error.message);}
    }

    async function createRoom(){
      if(!uid)return status("Please wait for Firebase connection.");
      const name=$("playerName").value.trim();
      if(!name)return status("Please enter your name.");
      if(busy)return; busy=true;
      try{
        let created=false;
        for(let i=0;i<5&&!created;i++){
          const code=makeCode();
          const result=await runTransaction(roomRef(code),current=>current===null?{
            host:uid,status:"lobby",round:0,questionIndex:0,questionStartedAt:0,
            players:{[uid]:{name,score:0,joinedAt:Date.now()}},answers:{}
          }:undefined,{applyLocally:false});
          if(result.committed){roomCode=code;created=true;}
        }
        if(!created)throw new Error("Could not create a room. Please try again.");
        isHost=true; watchRoom();
      }catch(error){status("Room creation failed: "+error.message);}
      finally{busy=false;}
    }

    async function joinRoom(){
      if(!uid)return status("Please wait for Firebase connection.");
      const name=$("playerName").value.trim();
      const code=$("roomInput").value.trim().toUpperCase();
      if(!name)return status("Please enter your name.");
      if(!/^[A-Z0-9]{6}$/.test(code))return status("Enter a 6-character room code.");
      if(busy)return; busy=true;
      try{
        const result=await get(roomRef(code));
        if(!result.exists())throw new Error("Room not found. Check the room code.");
        const room=result.val();
        if(room.status!=="lobby")throw new Error("This room has already started.");
        const players=room.players||{};
        if(!players[uid]&&Object.keys(players).length>=8)throw new Error("Room is full.");
        if(!players[uid]){
          const playerResult=await runTransaction(ref(db,"rooms/"+code+"/players"),current=>{
            current=current||{};
            if(current[uid])return current;
            if(Object.keys(current).length>=8)return;
            current[uid]={name,score:0,joinedAt:Date.now()};
            return current;
          },{applyLocally:false});
          if(!playerResult.committed)throw new Error("Room is full or could not add player. Try again.");
        }
        roomCode=code; isHost=room.host===uid; watchRoom();
      }catch(error){status("Could not join: "+error.message);}
      finally{busy=false;}
    }

    function watchRoom(){
      if(unsubscribe)unsubscribe();
      unsubscribe=onValue(roomRef(roomCode),snapshot=>{
        if(!snapshot.exists()){status("This room no longer exists.");return;}
        roomData=snapshot.val(); status("Room connected. Share the code with friends.");
        $("room").textContent=roomCode; $("players").innerHTML="";
        Object.values(roomData.players||{}).forEach(player=>{
          const p=document.createElement("p");p.textContent=player.name+" — "+player.score+" points";$("players").appendChild(p);
        });
        $("startButton").classList.toggle("hidden",!isHost||roomData.status!=="lobby");
        if(roomData.status==="lobby"){clearInterval(timerHandle);show("lobby");}
        if(roomData.status==="playing")renderQuestion();
        if(roomData.status==="finished"){clearInterval(timerHandle);renderResults();}
      },error=>status("Database error: "+error.message));
    }

    async function startQuiz(){
      if(!isHost||!roomData||roomData.status!=="lobby")return;
      if(Object.keys(roomData.players||{}).length<2)return status("At least 2 players are needed to start.");
      try{await update(roomRef(roomCode),{status:"playing",round:1,questionIndex:0,questionStartedAt:Date.now(),answers:{}});}
      catch(error){status("Could not start quiz: "+error.message);}
    }

    function renderQuestion(){
      show("quiz"); const index=roomData.questionIndex; const q=questions[index]; if(!q)return;
      $("roundInfo").textContent="Round "+(Math.floor(index/3)+1)+" of 3 · Question "+(index+1)+" of 9";
      $("question").textContent=q.q; $("options").innerHTML="";
      const alreadyAnswered=Boolean((roomData.answers||{})[index]?.[uid]);
      q.a.forEach((answer,i)=>{const button=document.createElement("button");button.className="option";button.textContent=answer;button.disabled=alreadyAnswered;button.onclick=()=>submitAnswer(i);$("options").appendChild(button);});
      updateScoreboard(); runTimer();
    }

    async function submitAnswer(choice){
      if(!roomData||roomData.status!=="playing")return;
      const index=roomData.questionIndex;
      const answerRef=ref(db,"rooms/"+roomCode+"/answers/"+index+"/"+uid);
      try{
        const result=await runTransaction(answerRef,current=>current===null?{choice,at:Date.now()}:undefined,{applyLocally:false});
        if(result.committed){
          if(choice===questions[index].c){
            const playerScoreRef=ref(db,"rooms/"+roomCode+"/players/"+uid+"/score");
            await runTransaction(playerScoreRef,score=>(score||0)+1,{applyLocally:false});
          }
          status("Answer submitted."); await maybeAdvance();
        }
      }catch(error){status("Answer could not be saved: "+error.message);}
    }

    function runTimer(){
      clearInterval(timerHandle); const started=roomData.questionStartedAt||Date.now();
      const tick=()=>{const left=Math.max(0,20-Math.floor((Date.now()-started)/1000));$("timer").textContent=left;if(left===0){clearInterval(timerHandle);maybeAdvance();}};
      tick();timerHandle=setInterval(tick,250);
    }

    async function maybeAdvance(){
      if(!isHost||advancing||!roomData||roomData.status!=="playing")return;
      const index=roomData.questionIndex, players=Object.keys(roomData.players||{}), answers=(roomData.answers||{})[index]||{};
      const allAnswered=players.every(id=>answers[id]);
      const timedOut=Date.now()>=(roomData.questionStartedAt||0)+20000;
      if(!allAnswered&&!timedOut)return;
      advancing=true;
      try{
        if(index>=8)await update(roomRef(roomCode),{status:"finished"});
        else await update(roomRef(roomCode),{questionIndex:index+1,questionStartedAt:Date.now()});
      }catch(error){status("Could not advance question: "+error.message);}
      finally{advancing=false;}
    }

    function updateScoreboard(){
      const players=Object.values(roomData.players||{}).sort((a,b)=>b.score-a.score);
      $("scoreboard").textContent="Scores: "+players.map(p=>p.name+": "+p.score).join(" · ");
    }
    function renderResults(){
      show("results"); const players=Object.values(roomData.players||{}); const highest=Math.max(0,...players.map(p=>p.score));
      const winners=players.filter(p=>p.score===highest).map(p=>p.name);
      $("finalScores").textContent="Winner(s): "+winners.join(", ")+" — "+highest+" points. "+players.sort((a,b)=>b.score-a.score).map(p=>p.name+": "+p.score).join(" | ");
    }
    $("createButton").addEventListener("click",createRoom);
    $("joinButton").addEventListener("click",joinRoom);
    $("startButton").addEventListener("click",startQuiz);
    $("homeButton").addEventListener("click",()=>location.reload());
    connect();
  </script>
</body>
</html>
